[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scar"
version = "0.1.0"
description = "State-Control-Action-Resource execution analysis and optimization prototype"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24", "networkx>=3.0,<4"]

[project.optional-dependencies]
native-source = ["tree-sitter==0.26.0", "tree-sitter-cpp==0.23.4"]
configuration-source = ["PyYAML>=6,<7", "antlr4-python3-runtime==4.9.3"]

[project.scripts]
scar = "scar.cli:main"

[tool.setuptools.packages.find]
include = ["scar*"]

[tool.setuptools]
py-modules = ["sitecustomize"]

[tool.setuptools.package-data]
"scar.codegen" = ["*.h", "*.in"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Macro-compiler target baseline; bounded region compilation is implemented.
[tool.scar.codegen]
host_backend = "cpp"
cxx_standard = 20
operator_abi_version = 1
execution_plan_schema_version = 1
operator_calling_convention = "c_function_table"
torch_abi = "inherit_imported_torch_target"
python_boundary = "entry_and_explicit_compatibility_calls"
